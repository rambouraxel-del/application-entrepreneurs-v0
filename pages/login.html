<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion — Cockpit Entrepreneur</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="login-page">
    <main class="login-card">
        <h1 class="login-title">Cockpit Entrepreneur</h1>
        <p class="login-subtitle">Pilotez votre activité simplement.</p>

        <form class="login-form" id="login-form">
            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" name="email" placeholder="vous@exemple.com" autocomplete="off">

            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="off">

            <button type="button" id="login-button" class="btn-primary">Se connecter</button>
        </form>

        <a href="#" class="login-link btn-wip">Mot de passe oublié ?</a>
    </main>

    <script src="../js/demo-config.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
